<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Document</title>
    
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>


</head>

<body>
    <a-scene embedded arjs="sourceType: webcam">
        <a-marker preset="hiro">
            <a-box position="0 0 0" color="skyblue" scale="0.2 0.2 0.2" ></a-box>
            <a-box position="1 0 0" color="skyblue" scale="0.2 0.2 0.2"></a-box>
            <a-box position="-1 0 0" color="skyblue" scale="0.2 0.2 0.2"></a-box>

            <a-box position="0 0 1" color="skyblue" scale="0.2 0.2 0.2" ></a-box>
            <a-box position="1 0 1" color="skyblue" scale="0.2 0.2 0.2"></a-box>
            <a-box position="-1 0 1" color="skyblue" scale="0.2 0.2 0.2"></a-box>

            <a-box position="0 0 -1" color="skyblue" scale="0.2 0.2 0.2" ></a-box>
            <a-box position="1 0 -1" color="skyblue" scale="0.2 0.2 0.2"></a-box>
            <a-box position="-1 0 -1" color="skyblue" scale="0.2 0.2 0.2"></a-box>
        </a-marker>

    <a-marker preset="kanji">
        <!-- 地球儀 -->
        <a-sphere
            position="0 0 0"
            color="red"
            animation="property:rotation;
            to:360 360 0;
            loop:true;
            dur:5000;
            ease:linear;
            "
       ></a-sphere>
            <a-sphere
            position="0 2.5 0"
            radius="0.8"
            scale="1 0.2 1"
            color="blue"
         ></a-sphere>

         <a-torus
            position="0 0 0"
            radius="1.3"
            radius-tubular="0.03"
            rotation="0 0 60"
            color="blue"
        ></a-torus>
        <a-cylinder
            position="0 2 0"
            rotation="0 90 0"
            radius="0.1" height="1.6"
            color="blue"
        ></a-cylinder>


     </a-marker>

            
      

        <a-entity camera></a-entity>
    </a-scene>
</body>

</html>
