<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.5.4/dist/aframe-extras.min.js"></script>

    <style>
        #hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 999;
        }

    </style>

</head>

<body>
    
    <div id="hud">
        <p>ROBOT HP:<span id="robotHpText">50</span></p>
        <progress id="robotHpBar" max="50" value="50"></progress>
        <br>
        <p>自分のHP:<span id="myHpText">50</span></p>
        <progress id="myHpBar" max="50" value="50"></progress>
        <p id="kaisin" style="display:none; font-size: 30px; font-weight:bold; color:blue;">会心の一撃！</p>
    </div>
    <a-scene embedded arjs="sourceType: webcam" cursor="rayOrigin: mouse" raycaster="objects: .clickable">

        <a-marker preset="hiro" smooth="true">
            <a-entity id="model" position="0 0 0.5">
                <a-gltf-model id="robot" class="clickable" src="robot.glb" position="0 0 0" scale="0.3 0.3 0.3"
                    rotation="-90 0 0" animation-mixer="clip: RobotArmature|Robot_Idle">
                </a-gltf-model>
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>

    <script>
        const robot = document.getElementById("robot");
        const robotHpText = document.getElementById("robotHpText");
        const robotHpBar = document.getElementById("robotHpBar");
        const myHpText = document.getElementById("myHpText");
        const myHpBar = document.getElementById("myHpBar");
        const kaisin = document.getElementById("kaisin");

        let robotHp = 50;
        let myHp = 50;

        const hitSound = new Audio("hit.mp3");
        const missSound = new Audio("miss.mp3");
        const deathSound = new Audio("death.mp3");
        const enemySound = new Audio("enemy-attack.mp3");

        function enemyAttack() {
            enemyAnimation();
            myHp -= Math.floor(Math.random() * 10 + 1);
            if (myHp < 0) {
                myHp = 0;
            }
            myHpText.textContent = myHp;
            myHpBar.value = myHp;
        }

        function enemyAnimation() {
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Punch",
                    loop: "once"
                }
            )
            enemySound.play();
        }
        robot.addEventListener("animation-finished", function (event) {
            if (event.detail.action.getClip().name === "RobotArmature|Robot_Jump") {
                enemyAttack();
            }
            if (event.detail.action.getClip().name === "RobotArmature|Robot_Sitting") {
                enemyAttack();
            }


        });

        function attack() {
            kaisin.style.display = "none";
            if (robotHp === 0 || myHp === 0) {
                return;
            }

            if (Math.random() < 0.3) {
                missSound.play();
                missAnimation();
                return;
            }
            let damage = Math.floor((Math.random()) * 10) + 1;



            let luck = (Math.random() * 10) + 1;
            if (luck > 3) {
                robotHp -= damage;
            } else {
                robotHp = robotHp - (damage * 1.5);
                kaisin.style.display = "block";

            }



            if (robotHp < 0) {
                robotHp = 0;
            }
            robotHpText.textContent = robotHp;
            robotHpBar.value = robotHp;

            if (robotHp === 0) {
                deathAnimation();
            } else {
                hitAnimation();
            }

        }
        robot.addEventListener("click", attack);

        function missAnimation() {
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Sitting",
                    loop: "once"
                }
            );
        }

        function hitAnimation() {
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Jump",
                    loop: "once"
                }

            )
            hitSound.play();
        }

        function deathAnimation() {
            robot.removeAttribute("animation-mixer");
            robot.setAttribute(
                "animation-mixer",
                {
                    clip: "RobotArmature|Robot_Death",
                    loop: "once",
                    clampWhenFinished: true
                }
            )
            deathSound.play();
        }

        // function robotWave(){
        //     robot.setAttribute("animation-mixer","clip","RobotArmature|Robot_Wave");
        // }
        // robot.addEventListener("click",robotWave);
    </script>
</body>

</html>
