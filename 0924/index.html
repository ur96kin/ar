<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.4/dist/aframe-physics-system.min.js"></script>

</head>
<body>
    <a-scene>
        <a-assets><img id="wood" src="../assets/images/Walnut04-p.jpg" alt=""></a-assets>
        <a-assets><img id="desk" src="../assets/images/Walnut05-p.jpg" alt=""></a-assets>
        <a-assets><img id="foot" src="../assets/images/Stainless-Steel-HairLine.jpg" alt=""></a-assets>
        <a-assets><img id="shelf" src="../assets/images/Concrete-Wall-Large-p.jpg" alt=""></a-assets>
        <a-assets><img id="earth" src="../assets/images/water-bg-pattern-03.jpg" alt=""></a-assets>
        <a-assets><img id="shelf2" src="../assets/images/Walnut01-p.jpg" alt=""></a-assets>

        <a-box
            rotation="-90 0 0"
            width="40"
            height="20"
            depth="0.5"
            material="src:#wood; repeat:10 10"
        ></a-box>

        <!-- おく壁 -->
        <a-plane
            rotation="0 0 0"
            position="0 10 -10"
            width="40"
            height="20"
            color="#E8E0B8"
        ></a-plane>
        <a-plane
            rotation="0 0 0"
            position="0 2.5 -9.93"
            width="40"
            height="5"
            material="src:#wood"
        ></a-plane>
        <!-- 黒板 -->
        <a-plane
            rotation="0 0 0"
            position="6 11 -9.93"
            width="21"
            height="9"
            material="src:#wood"
        ></a-plane>
        <a-plane
            rotation="0 0 0"
            position="6 11 -9.91"
            width="20"
            height="8"
            color="#2F5D50"
        ></a-plane>
        <!-- ボード -->
        <a-plane
            rotation="0 0 0"
            position="-12 11 -9.93"
            width="14"
            height="8"
            material="src:#wood"
        ></a-plane>
        <a-plane
            rotation="0 0 0"
            position="-12 11 -9.8"
            width="13"
            height="7"
            color="#50C878"
        ></a-plane>
        <!-- 紙 -->
        <a-plane
            rotation="0 0 0"
            position="-12 11 -9.75"
            width="2"
            height="3"
            color="white"
        ></a-plane>
        <a-plane
            rotation="0 0 0"
            position="-9 12 -9.75"
            width="2"
            height="3"
            color="#F7F6F2"
        ></a-plane>


        <!-- ドア壁 -->
        <a-plane
            rotation="0 -90 0"
            position="20 10 0"
            width="20"
            height="20"
            color="#E8E0B8"
        ></a-plane>
        <a-plane
            rotation="0 -90 0"
            position="19.95 2.5 0"
            width="20"
            height="5"
            material="src:#wood"
        ></a-plane>
        <!-- ドア -->
        <a-plane
            rotation="0 -90 0"
            position="19.95 8 -1"
            width="7"
            height="10"
            material="src:#wood"
        ></a-plane>
        <a-plane
            rotation="0 -90 0"
            position="19.93 8 -1"
            width="2"
            height="3.5"
            color="#16213E"
        ></a-plane>
        <a-plane
            rotation="0 -90 0"
            position="19.94 6 -4.3"
            width="0.3"
            height="14"
            material="src:#shelf2"
        ></a-plane>
        <a-plane
            rotation="0 -90 0"
            position="19.94 6 2.3"
            width="0.3"
            height="14"
            material="src:#shelf2"
        ></a-plane>


        <!-- 窓壁 -->
        <a-plane
            rotation="0 90 0"
            position="-20 10 0"
            width="20"
            height="20"
            color="#E8E0B8"
        ></a-plane>
        <a-plane
            rotation="0 90 0"
            position="-19.95 2.5 0"
            width="20"
            height="5"
            material="src:#wood"
        ></a-plane>
        <a-plane
            rotation="0 90 0"
            position="-19.9 12 0"
            width="14"
            height="10"
            color="#FFFDF5"
        ></a-plane>
        <a-box
            rotation="0 90 0"
            position="-19.9 12 0"
            width="0.4"
            height="10"
            depth="0.4"
            material="src:#foot"
        ></a-box>
        <a-box
            rotation="0 90 0"
            position="-19.9 12 4"
            width="0.2"
            height="10"
            depth="0.2"
            material="src:#foot"
        ></a-box>
        <a-box
            rotation="0 90 0"
            position="-19.9 12 -4"
            width="0.2"
            height="10"
            depth="0.2"
            material="src:#foot"
        ></a-box>
        <a-box
            rotation="90 0 0"
            position="-19.9 12 0"
            width="0.2"
            height="14"
            depth="0.2"
            material="src:#foot"
        ></a-box>

        <!-- 長い机 -->
        <a-box
            position="3 5 0"
            width="16"
            height="0.5"
            depth="6"   
            material="src:#desk"                
        ></a-box>
        <a-box
            position="-4 2 -2.5"
            width="0.7"
            height="6"
            depth="0.7"
            rotation="0 90 0"   
            material="src:#foot"                
        ></a-box>
        <a-box
            position="-4 2 2.5"
            width="0.7"
            height="6"
            depth="0.7"
            material="src:#foot"
        ></a-box>
        <a-box
            position="10 2 2.5"
            width="0.7"
            height="6"
            depth="0.7"
            material="src:#foot"
        ></a-box>
        <a-box
            position="10 2 -2.5"
            width="0.7"
            height="6"
            depth="0.7"
            material="src:#foot"
        ></a-box>

        <!-- 短い机 -->
        <a-box
            position="-11 5 0"
            width="6"
            height="0.5"
            depth="4"   
            material="src:#desk"                
        ></a-box>
        <a-box
            rotation="90 0 0"
            position="-9 4.5 0"
            width="1"
            height="3"
            depth="1"
            material="src:#foot"
        ></a-box>
        <a-box 
            position="-13.6 2 -1.6"
            width="0.4" height="6" depth="0.4"
            material="src:#foot">
        </a-box>
        <a-box 
            position="-13.6 2 1.6"
            width="0.4" height="6" depth="0.4"
            material="src:#foot">
        </a-box>
        <a-box 
            position="-8.4 2 -1.6"
            width="0.4" height="6" depth="0.4"
            material="src:#foot">
        </a-box>
        <a-box 
            position="-8.4 2 1.6"
            width="0.4" height="6" depth="0.4"
            material="src:#foot">
        </a-box>

        <!-- PCいす -->
        <a-box 
            position="-16 2.9 0"
            width="3" height="0.5" depth="2"
            material="src:#foot">
        </a-box>
        <a-box 
            position="-17.5 4.7 0"
            rotation="90 0 180"
            width="0.2" height="2.5" depth="1"
            material="src:#foot">
        </a-box>
        <a-box 
            position="-17.5 3.7 0"
            rotation="90 0 180"
            width="0.1" height="0.5" depth="1.5"
            material="src:#foot">
        </a-box>
        <a-box 
            position="-16 0.5 0"
            rotation="90 45 180"
            width="3.4" height="0.3" depth="0.3"
            material="src:#foot">
        </a-box>
        <a-box 
            position="-16 0.5 0"
            rotation="90 135 180"
            width="3.4" height="0.3" depth="0.3"
            material="src:#foot">
        </a-box>
        <a-box 
            position="-16 1.8 0"
            rotation="0 90 0"
            width="1" height="2.3" depth="0.5"
            material="src:#foot">
        </a-box>

        <!-- PCモニター -->
         <a-sphere
            position="-10 5.3 0"
            radius="0.8"
            scale="1 0.2 1"
         ></a-sphere>
         <a-box
            position="-9.4 7 0"
            rotation="15 90 0"
            width="3" height="2" depth="0.3"
         ></a-box>
         <a-box
            position="-9.5 7 0"
            rotation="15 90 0"
            width="2.8" height="1.8" depth="0.2"
            color="black"
         ></a-box>
         <a-box
            position="-9.4 6.5 0"
            rotation="15 90 0"
            width="1" height="2.5" depth="0.2"
         ></a-box>
         <!-- PCハード -->
         <a-box
            position="-7.3 1.8 4.6"
            width="2" height="2" depth="0.9"
         ></a-box>
         <!-- keyboard -->
         <a-box
            position="-12.8 5.5 0.4"
            rotation="90 0 0"
            width="1" height="3" depth="0.2"
            material="src:#shelf"></a-box>
         ></a-box>

         <!-- sankakusui -->
         <a-cone
            position="-11 5.6 -1.4"
            radius-bottom="0.5"
            radius-top="0"
            height="0.8"
            color="black">
        </a-cone>

        


        <!-- おく壁配置のもの -->
        <!-- ボックス -->
        <a-box
            position="-14 4 -8.8"
            width="8"
            height="7"
            depth="2"
            material="src:#foot">
        </a-box>
        <!-- 棚1 -->
        <a-box
            position="-7 4 -8.8"
            width="4"
            height="7"
            depth="2"
            material="src:#shelf">
        </a-box>
        <!-- 棚2 -->
        <a-box
            position="-1 2 -8.8"
            width="8"
            height="6"
            depth="2"
            material="src:#shelf2">
        </a-box>
        <a-box
            position="-2 2 -7.8"
            rotation="0 90 90"
            width="6"
            height="0.1"
            depth="0.1"
            color="#1A1020">
        </a-box>
        <a-box
            position="0 2 -7.8"
            rotation="0 90 90"
            width="6"
            height="0.1"
            depth="0.1"
            color="#1A1020">
        </a-box>

        <!-- teapot -->
        <a-cone
            position="-7.5 8 -8.8"
            radius-top="0.4"
            radius-bottom="0.6"
            height="2"    
        ></a-cone>
        <a-cone
            position="-6.8 7.8 -8.8"
            radius-top="0.4"
            radius-bottom="0.6"
            height="0.6"    
        ></a-cone>
        
        <!-- 地球儀 -->
        <a-sphere
            position="-14 10 -8.8"
            material="src:#earth"
            animation="property:rotation;
            to:360 360 0;
            loop:true;
            dur:5000;
            ease:linear;
            "
       ></a-sphere>
       <a-sphere
            position="-14 7.5 -8.8"
            radius="0.8"
            scale="1 0.2 1"
            material="src:#wood"
         ></a-sphere>
         <!-- ↓AI使用 -->
        <a-torus
            position="-14 10 -8.8"
            radius="1.3"
            radius-tubular="0.03"
            rotation="0 0 60"
            material="src:#wood"
        ></a-torus>
        <a-cylinder
            position="-14 8 -8.8"
            rotation="0 90 0"
            radius="0.1" height="1.6"
            material="src:#wood"
        ></a-cylinder>


       <!-- 中央パイプ椅子 -->
        <a-box 
            position="4 2.9 5"
            width="3" height="0.5" depth="2"
            material="src:#foot">
        </a-box>
        <a-box 
            position="4 4 6.56"
            rotation="120 0 0"
            width="1" height="0.4" depth="1.8"
            material="src:#foot">
        </a-box>
        <a-box 
            position="4 5 6.56"
            rotation="120 0 0"
            width="2.5" height="0.4" depth="1.2"
            material="src:#foot">
        </a-box>
        <a-cylinder
            position="5.2 0.4 5.2"
            rotation="90 90 90"
            radius="0.05" height="2"
            material="src:#foot">
        ></a-cylinder>
        <a-cylinder
            position="5.2 1.5 5.8"
            rotation="0 90 0"
            radius="0.05" height="2.2"
            material="src:#foot">
        ></a-cylinder>
        <a-cylinder
            position="5.2 1.5 4.4"
            rotation="0 90 0"
            radius="0.05" height="2.2"
            material="src:#foot">
        ></a-cylinder>
        <a-cylinder
            position="2.8 0.4 5.2"
            rotation="90 90 90"
            radius="0.05"
            height="2"
            material="src:#foot">
        </a-cylinder>
        <a-cylinder
            position="2.8 1.5 5.8"
            rotation="0 90 0"
            radius="0.05"
            height="2.2"
            material="src:#foot">
        </a-cylinder>
        <a-cylinder
            position="2.8 1.5 4.4"
            rotation="0 90 0"
            radius="0.05"
            height="2.2"
            material="src:#foot">
        </a-cylinder>

        <!-- 中央PC椅子 -->
        <a-box
            position="4 2.9 -3"
            rotation="0 90 0"
            width="3" height="0.5" depth="2"
            material="src:#foot">
        </a-box>
        <a-box
            position="4 4.7 -4.5"
            rotation="90 90 180"
            width="0.2" height="2.5" depth="1"
            material="src:#foot">
        </a-box>
        <a-box
            position="4 3.7 -4.5"
            rotation="90 90 180"
            width="0.1" height="0.5" depth="1.5"
            material="src:#foot">
        </a-box>
        <a-box
            position="4 0.5 -3"
            rotation="90 135 180"
            width="3.4" height="0.3" depth="0.3"
            material="src:#foot">
        </a-box>
        <a-box
            position="4 0.5 -3"
            rotation="90 225 180"
            width="3.4" height="0.3" depth="0.3"
            material="src:#foot">
        </a-box>
        <a-box
            position="4 1.8 -3"
            rotation="0 0 0"
            width="1"
            height="2.3"
            depth="0.5"
            material="src:#foot">
        </a-box>
        

        


        <a-camera position="0 9 15"></a-camera>
       
    </a-scene>
    
</body>
</html>
