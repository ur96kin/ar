<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
       
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/projapayuri/aframe-gesture-hands@v0.9.2/aframe-gesture-hands.js"></script>

</head>
<body>
    <a-scene id="scene" hands>
        <a-assets>
        <video
            id="video"
            src="sky.mp4"
            preload="auto"
            playsinline
            muted
        
        ></video>
        </a-assets>

        <a-video
            src="#video"
            opacity="0.8"
            width="3.2"
            height="1.8"
            rotation="-10 0 0"
            position="0 2 -4"
        
        ></a-video>


        <a-plane
            id="playButton"
            color="blue"
            opacity="0.8"
            width="0.9"
            height="0.35"
            rotation="-10 0 0"
            position="-0.3 1 -2"
        ></a-plane>
        <a-text value="START"
                 position="-0.3 1 -1.9"
                 align="center"
                 anchor="center"
        ></a-text>

        <a-plane
            id="stopButton"
            color="red"
            opacity="0.8"
            width="0.9"
            height="0.35"
            rotation="-10 0 0"
            position="0.6 1 -2"
        ></a-plane>
        <a-text value="STOP"
                 position="0.6 1 -1.9"
                 align="center"
                 anchor="center"
        ></a-text>
        
    </a-scene>
    <script>
        const scene=document.getElementById("scene");
        const video=document.getElementById("video");
        const playButton=document.getElementById("playButton");
        const stopButton=document.getElementById("stopButton");
        const touchSound=new Audio("touch.mp3");
       
  

        

    



        let wasPlayInside=false;
        let wasStopInside=false;

        function controlVideo() {
            const hands=scene.components.hands;

            const playInside=hands.isPointOnEntity(8, playButton);
            const stopInside=hands.isPointOnEntity(8, stopButton);

            if (playInside && !wasPlayInside) {
                video.play();

                touchSound.currentTime = 0;
                touchSound.play();
            }

            if (stopInside && !wasStopInside) {
                video.pause();

                touchSound.currentTime = 0;
                touchSound.play();
            }

            wasPlayInside=playInside;
            wasStopInside=stopInside;
        }

        scene.addEventListener("hand-result", controlVideo);
        
    </script>
</body>
</html>
